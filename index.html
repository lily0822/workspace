<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麗與牛工作區域 | Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .portal-container {
            max-width: 1000px;
            margin: 4rem auto;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }
        .portal-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
        }
        .portal-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }
        .portal-icon {
            font-size: 3.5rem;
            color: var(--primary-color);
            transition: transform 0.3s ease;
        }
        .portal-card:hover .portal-icon {
            transform: scale(1.1);
        }
        .portal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .portal-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            text-align: center;
        }
        @media (max-width: 768px) {
            .portal-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <header class="app-header" style="flex-direction: column; text-align: center; padding: 3rem; gap: 1rem;">
            <h1 style="font-size: 2rem; justify-content: center;"><i class="fa-solid fa-briefcase"></i> 麗與牛工作區域</h1>
            <p style="font-size: 1.1rem; color: var(--text-secondary);">請選擇您要管理的後台區域</p>
        </header>

        <main class="portal-grid">
            <a href="connection.html" class="portal-card">
                <i class="portal-icon fa-solid fa-plane"></i>
                <div class="portal-title">連線區域</div>
                <div class="portal-desc">管理代購連線時程與清單</div>
            </a>
            
            <a href="stalls.html" class="portal-card">
                <i class="portal-icon fa-solid fa-store"></i>
                <div class="portal-title">擺攤區域</div>
                <div class="portal-desc">管理市集出攤紀錄與排程</div>
            </a>
            
            <a href="accounting.html" class="portal-card">
                <i class="portal-icon fa-solid fa-file-invoice-dollar"></i>
                <div class="portal-title">記帳區域</div>
                <div class="portal-desc">管理營收、對帳與繳費狀態</div>
            </a>
        </main>
    </div>
</body>
</html>
